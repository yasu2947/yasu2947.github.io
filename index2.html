<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도깨비 | 한월 RPG 툴모음</title>
  <link rel="icon" type="image/png" href="images/yasu.png">
  <link rel="icon" href="images/yasu.png" sizes="32x32">
  <link rel="icon" href="images/yasu.png" sizes="192x192">
  <link rel="apple-touch-icon" href="images/yasu.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #050914;
    }

    /* ── Scene ─────────────────────────────── */
    .scene {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden;
    }

    /* ── Panels ─────────────────────────────── */
    .panel {
      position: absolute;
      top: 0; height: 100%; width: 100%;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.5s ease;
      will-change: opacity;
      transform: translateZ(0);
    }

    /* Left: dark blue (스텟 계산기 — 기존과 동일) */
    .panel-left {
      background:
        radial-gradient(ellipse 60% 80% at 20% 50%, #162d52 0%, #0b1830 55%, #050914 100%);
      clip-path: polygon(0 0, 57% 0, 46% 100%, 0 100%);
      justify-content: flex-start;
    }

    /* Right: dark charcoal + green (스킬 매크로 앱 색감) */
    .panel-right {
      background:
        radial-gradient(ellipse 60% 80% at 80% 50%, #0e1d12 0%, #0b1510 55%, #050914 100%);
      clip-path: polygon(57% 0, 100% 0, 100% 100%, 46% 100%);
      justify-content: flex-end;
    }

    /* Subtle grid overlay */
    .panel-left::before, .panel-right::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    /* Dim overlay */
    .panel::after {
      content: '';
      position: absolute; inset: 0;
      background: #000;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      z-index: 3;
    }

    /* ── Hover states ── */
    .scene.hover-left  .panel-right::after { opacity: 0.62; }
    .scene.hover-right .panel-left::after  { opacity: 0.62; }

    /* ── Content blocks ─────────────────────── */
    .content {
      position: relative; z-index: 4;
      display: flex; flex-direction: column;
      gap: 22px;
      width: 340px;
      user-select: none;
      pointer-events: none;
    }

    .panel-left  .content { margin-left: 9vw; align-items: flex-start; }
    .panel-right .content { margin-right: 7vw; align-items: flex-end; text-align: right; }

    /* Icon */
    .icon {
      font-size: 68px; line-height: 1;
      filter: drop-shadow(0 0 22px var(--accent));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }
    .panel-right .icon { animation-delay: -2s; }

    /* Label */
    .label {
      font-size: 11px; font-weight: 900;
      letter-spacing: 4px; text-transform: uppercase;
      color: var(--accent);
      opacity: 0.7;
    }

    /* Title */
    h2 {
      font-size: clamp(28px, 3.2vw, 42px);
      font-weight: 900; line-height: 1.2;
      color: #eaf1ff;
      text-shadow: 0 0 40px var(--accent-glow);
    }

    /* Description */
    .desc { font-size: 14px; color: #8ea0c2; line-height: 1.75; }

    /* Tags */
    .tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .panel-right .tags { justify-content: flex-end; }

    .tag {
      padding: 5px 11px; border-radius: 8px;
      font-size: 12px; font-weight: 700;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--accent-border);
      color: var(--accent-text);
      transition: background 0.3s;
    }

    /* CTA button */
    .cta {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 26px; border-radius: 12px;
      font-size: 14px; font-weight: 900; letter-spacing: 1px;
      border: 1px solid var(--accent-border);
      color: var(--accent);
      background: rgba(255,255,255,0.04);
      transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
    }

    .scene.hover-left  .panel-left  .cta,
    .scene.hover-right .panel-right .cta {
      background: rgba(255,255,255,0.09);
      box-shadow: 0 0 24px var(--accent-glow);
      border-color: var(--accent);
    }

    /* ── Per-panel CSS variables ───────────── */
    .panel-left {
      --accent:        #5599ff;
      --accent-glow:   rgba(85,153,255,0.35);
      --accent-border: rgba(85,153,255,0.35);
      --accent-text:   #7ab8ff;
    }

    /* 스킬 매크로 앱 색감: #4ade80 + 차콜 */
    .panel-right {
      --accent:        #4ade80;
      --accent-glow:   rgba(74,222,128,0.35);
      --accent-border: rgba(74,222,128,0.30);
      --accent-text:   #6ef09a;
    }

    /* ── Diagonal divider SVG ──────────────── */
    .divider-svg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 6;
      overflow: visible;
    }

    /* ── Ambient glow orbs (static) ─────────── */
    .orb {
      position: absolute; border-radius: 50%;
      pointer-events: none;
    }
    .orb-left  {
      width: 360px; height: 360px;
      background: radial-gradient(circle, rgba(34,85,204,0.22) 0%, transparent 70%);
      left: -80px; top: 50%; transform: translateY(-50%);
    }
    /* 오른쪽 orb: 초록 */
    .orb-right {
      width: 360px; height: 360px;
      background: radial-gradient(circle, rgba(74,222,128,0.18) 0%, transparent 70%);
      right: -80px; top: 50%; transform: translateY(-50%);
    }

    /* ── Fade overlay ──────────────────────── */
    .fade-overlay {
      position: fixed; inset: 0;
      background: #050914;
      opacity: 0; pointer-events: none;
      z-index: 100;
      transition: opacity 0.55s ease;
    }
    .fade-overlay.active { opacity: 1; pointer-events: all; }

    /* ── Responsive ────────────────────────── */
    @media (max-width: 700px) {
      .scene { overflow-y: auto; }
      .panel {
        position: relative;
        width: 100%; height: 50vh;
        clip-path: none !important;
        justify-content: center !important;
      }
      .panel-left  .content,
      .panel-right .content { margin: 0; align-items: center; text-align: center; }
      .panel-right .tags { justify-content: center; }
      .divider-svg { display: none; }
      .orb { display: none; }
      .panel::after { display: none; }
    }
  </style>
</head>
<body>

<div class="scene" id="scene">

  <!-- Fade overlay -->
  <div class="fade-overlay" id="fadeOverlay"></div>

  <!-- Ambient orbs -->
  <div class="orb orb-left"></div>
  <div class="orb orb-right"></div>

  <!-- ══ Left Panel: Stat Calculator ══ -->
  <div class="panel panel-left" id="panelLeft">
    <div class="content">
      <div class="icon">👺</div>
      <div class="label">Stat Calculator</div>
      <h2>도깨비<br>스텟 계산기</h2>
      <p class="desc">한월 RPG 스텟 시뮬레이터<br>DPM · 환산 · 배분까지 한 번에</p>
      <div class="tags">
        <span class="tag">⚔ 공격력</span>
        <span class="tag">💪 힘</span>
        <span class="tag">💨 민첩</span>
        <span class="tag">🍀 행운</span>
        <span class="tag">❤ 생명력</span>
      </div>
      <div class="cta">입장하기 &nbsp;→</div>
    </div>
  </div>

  <!-- ══ Right Panel: Skill Macro ══ -->
  <div class="panel panel-right" id="panelRight">
    <div class="content">
      <div class="icon">⚡</div>
      <div class="label">Skill Macro</div>
      <h2>도깨비<br>스킬 매크로</h2>
      <p class="desc">한월 RPG 스킬 자동화 도구<br>키 입력 · 딜레이 · 루프 설정</p>
      <div class="tags">
        <span class="tag">🎯 스킬 등록</span>
        <span class="tag">⏱ 딜레이</span>
        <span class="tag">🔁 루프</span>
        <span class="tag">🖱 클릭</span>
      </div>
      <div class="cta">←&nbsp; 입장하기</div>
    </div>
  </div>

  <!-- ══ Diagonal divider line ══ -->
  <!-- 왼쪽: 파랑, 오른쪽: 초록으로 색감 이어지는 그라데이션 -->
  <svg class="divider-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <linearGradient id="divGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#1a3a2a" stop-opacity="0"/>
        <stop offset="25%"  stop-color="#3a7a58" stop-opacity="0.7"/>
        <stop offset="50%"  stop-color="#4ade80" stop-opacity="0.6"/>
        <stop offset="75%"  stop-color="#3a7a58" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#1a3a2a" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <line x1="57" y1="0" x2="46" y2="100"
          stroke="url(#divGrad)" stroke-width="0.25"
          vector-effect="non-scaling-stroke"/>
    <line x1="57" y1="0" x2="46" y2="100"
          stroke="rgba(74,222,128,0.12)" stroke-width="3"
          vector-effect="non-scaling-stroke"
          style="filter: blur(4px);"/>
  </svg>

</div>

<script>
  const scene      = document.getElementById('scene');
  const panelLeft  = document.getElementById('panelLeft');
  const panelRight = document.getElementById('panelRight');
  const overlay    = document.getElementById('fadeOverlay');

  panelLeft.addEventListener('mouseenter', () => {
    scene.classList.add('hover-left');
    scene.classList.remove('hover-right');
  });
  panelRight.addEventListener('mouseenter', () => {
    scene.classList.add('hover-right');
    scene.classList.remove('hover-left');
  });
  scene.addEventListener('mouseleave', () => {
    scene.classList.remove('hover-left', 'hover-right');
  });

  function navigate(url) {
    overlay.classList.add('active');
    setTimeout(() => { window.location.href = url; }, 560);
  }

  panelLeft.addEventListener('click',  () => navigate('stat_calculator/'));
  panelRight.addEventListener('click', () => navigate('skill_macro/'));
</script>

</body>
</html>
